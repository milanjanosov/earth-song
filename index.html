<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth Song</title>
<meta name="description" content="A spinning 3D globe that plays its own elevation as music.">
<style>
  :root {
    --bg: #05070d;
    --ink: #e9e6df;
    --dim: #8a8f9c;
    --line: #fff1d6;
    --cap-top: #2a2f3a;
    --cap-bot: #1b1f27;
    --cap-edge: #0c0e13;
    --cap-ink: #d9dce3;
    --accent: #d96d3b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(18px, env(safe-area-inset-top)) 16px 0;
    text-align: center; pointer-events: none;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.02em; }
  header p { margin: 6px auto 0; max-width: 580px; color: var(--dim); font-size: 13.5px; }

  #lon {
    position: fixed; left: 50%; transform: translateX(-50%);
    font: 600 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--line); letter-spacing: 0.06em; pointer-events: none;
    text-shadow: 0 0 8px rgba(255, 220, 160, 0.45);
  }
  #lon.paused { color: var(--accent); text-shadow: 0 0 8px rgba(217, 109, 59, 0.5); }

  .controls {
    position: fixed; left: 0; right: 0;
    bottom: calc(34px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 12px;
  }
  .key { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .key small {
    color: var(--dim); font-size: 11px; letter-spacing: 0.04em; white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .key small b { color: var(--cap-ink); font-weight: 600; }
  button.cap {
    width: 58px; height: 54px; padding: 0; border: 1px solid var(--cap-edge);
    border-radius: 10px; color: var(--cap-ink); cursor: pointer;
    background: linear-gradient(180deg, var(--cap-top), var(--cap-bot));
    box-shadow: 0 5px 0 var(--cap-edge), 0 7px 14px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
    transform: translateY(0);
    transition: transform 60ms ease-out, box-shadow 60ms ease-out, color 90ms, border-color 90ms;
    touch-action: none; -webkit-touch-callout: none;
    display: grid; place-items: center;
  }
  button.cap svg { width: 22px; height: 22px; fill: currentColor; }
  button.cap:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  button.cap.down {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--cap-edge), 0 2px 5px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  /* arrows held, auto on, paused, sound on: the meridian-orange accent */
  button.cap.on, button.cap.arrow.down {
    color: var(--accent); border-color: rgba(217, 109, 59, 0.85);
  }
  button.cap.arrow.down {
    background: linear-gradient(180deg, #3a2a24, #241a16);
    box-shadow: 0 1px 0 var(--cap-edge), 0 0 16px rgba(217, 109, 59, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .gap { width: 10px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    text-align: center; color: #5d6270; font-size: 11px; pointer-events: none;
  }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    text-align: center; color: var(--dim);
  }
  @media (max-width: 440px) {
    button.cap { width: 50px; height: 48px; }
    .controls { gap: 8px; }
    .gap { width: 2px; }
    header p { font-size: 12.5px; }
    .key small { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <h1>Earth Song</h1>
  <p>Hold the arrows or drag to spin. The terrain under the line plays as music: pitch is elevation, the oceans stay quiet.</p>
</header>

<div id="lon">0&deg;</div>

<div class="controls" role="group" aria-label="Globe controls">
  <div class="key">
    <button class="cap arrow" id="k-left" title="Spin west (hold Left arrow)" aria-label="Spin west (left arrow)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 6.5 12l9 7.5z"/></svg>
    </button>
    <small>left</small>
  </div>
  <div class="key">
    <button class="cap arrow" id="k-right" title="Spin east (hold Right arrow)" aria-label="Spin east (right arrow)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 17.5 12l-9 7.5z"/></svg>
    </button>
    <small>right</small>
  </div>
  <div class="gap"></div>
  <div class="key">
    <button class="cap" id="k-auto" title="Auto-rotate, one turn per minute (R)" aria-label="Auto-rotate (R)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35A7.96 7.96 0 0 0 12 4z"/>
      </svg>
    </button>
    <small><b>R</b> auto</small>
  </div>
  <div class="key">
    <button class="cap" id="k-pause" title="Pause / resume everything (P or Space)" aria-label="Pause (P or Space)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="i-pause"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" id="i-play" style="display:none"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <small><b>P</b> pause</small>
  </div>
  <div class="key">
    <button class="cap" id="k-sound" title="Sound on/off (S)" aria-label="Sound on or off (S)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z"/>
        <path id="i-waves" d="M15.5 8.5a5 5 0 0 1 0 7l-1.06-1.06a3.5 3.5 0 0 0 0-4.88zM17.6 6.4a8 8 0 0 1 0 11.2l-1.06-1.06a6.5 6.5 0 0 0 0-9.08z" opacity="0.25"/>
      </svg>
    </button>
    <small><b>S</b> sound</small>
  </div>
</div>

<footer>ETOPO 10-arc-min elevation - NOAA</footer>
<div id="err"></div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
